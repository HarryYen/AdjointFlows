defaults:
  seismogram:
    tbeg: -30              # Cutting time: start (seconds)
    tend: 150              # Cutting time: end (seconds)
    tcor: 0.0              # Systematic time shift to correct (if any)
    dt: 0.0160             # Resampling rate for both data and synthetics
    component:
      COMP: semv           # Synthetic component to use
      EN2RT: 0             # Rotate E & N to R & T (1: yes, 0: no)
    fine_tune:
      EGF:
        criteria:
          n_wavelength: 2.0        # Distance threshold = P2 * n_wavelength * ref_velocity_km_s
          ref_velocity_km_s: 3.   # Reference velocity for wavelength (km/s)
    gradients_weighting:
      normalization: p95_in_stage_first_iter  # How each dataset gradient is normalized before combination: absmax_in_stage_first_iter, p95_in_stage_first_iter, or none
      use_dataset_gradient_weight: 1          # 1: after normalization, also multiply each dataset by inversion.gradient_weight during combination; 0: combine normalized gradients directly
      
datasets:
  # Specify the parameters of a specific dataset here.
  # - name: the name of this dataset, used to be file suffix
  # - data: parameters for observed data
  #   - waveform_dir: directory under DATA/ where observed waveforms are stored
  # - synthetics: parameters for synthetic data
  #   - do_wave_simulation: 1: simulate synthetics, 0: skip simulation
  #   - waveform_dir: directory under SYN/ where synthetic waveforms are stored (do_wave_simulation=1) 
  #                         or read from (do_wave_simulation=0)                      
  # - source: source type (cmt, force) 
  # - list: event/station list under DATA/evlst and DATA/stlst, respectively
  # - seismogram: seismogram parameters
  #  - filter: {P1: min period, P2: max period} for bandpass filter
  # - flexwin:
  #   - par_file: parameter file under FLEXWIN/
  #   - bin_file: output windows dir under FLEXWIN/
  #   - user_dir: windows dir under TOMO/ when flexwin_mode == 'user'

  - name: EGF_5_12s
    data:
      waveform_dir: wav_all
    synthetics:
      do_wave_simulation: 1
      waveform_dir: SYN_EGF
    flexwin:
      par_file: Joint_par_and_bin/EGF_5_12/PAR_FILE      # **(under FLEXWIN/)** the parameter file for FLEXWIN
      bin_file: Joint_par_and_bin/EGF_5_12/flexwin     # **(under FLEXWIN/)** the directory to store time-windows picked by FLEXWIN
      user_dir: user_windows
    measure_adj:
      par_file: Joint_par/EGF_5_12/MEASUREMENT.PAR  # **(under MEASURE_ADJ/)** the parameter file for measuring adjoint sources
      bin_file: measure_adj
    source:
      type: force
    list:
      evlst: sta_91_EGF.txt
      evchk: sta_21_EGF.txt
      stlst: sta_91_EGF.txt
    seismogram:
      filter: {P1: 5, P2: 12}
    inversion:
      weight: 1                  # Weight used when averaging misfit across datasets
      gradient_weight: 1         # Weight used only when combining dataset gradients; if omitted, workflow falls back to inversion.weight
      smoothing:
        ISMOOTH: 1            # Smooth kernel (1: yes, 0: no)
        smooth_par_gradient:
          SIGMA_H: 4000        # Horizontal smoothing width (m)
          SIGMA_V: 4000         # Vertical smoothing width (m)
  

  - name: EQ_5_12s
    data:
      waveform_dir: wav_EQ
    synthetics:
      do_wave_simulation: 1
      waveform_dir: SYN_EQ
    flexwin:
      par_file: Joint_par_and_bin/EQ_5_12/PAR_FILE      # **(under FLEXWIN/)** the parameter file for FLEXWIN
      bin_file: Joint_par_and_bin/EQ_5_12/flexwin    # **(under FLEXWIN/)** the directory to store time-windows picked by FLEXWIN
      user_dir: user_windows
    measure_adj:
      par_file: Joint_par/EQ_5_12/MEASUREMENT.PAR  # **(under MEASURE_ADJ/)** the parameter file for measuring adjoint sources
      bin_file: measure_adj
    source:
      type: cmt
    list:
      evlst: fwi_new_cat_version4.txt
      evchk: fwi_new_cat_version4_18.txt
      stlst: sta_new_remove_western.txt
    seismogram:
      filter: {P1: 5, P2: 12}
    inversion:
      weight: 1.                 # Weight used when averaging misfit across datasets
      gradient_weight: 1.        # Weight used only when combining dataset gradients; if omitted, workflow falls back to inversion.weight
      smoothing:
        ISMOOTH: 1            # Smooth kernel (1: yes, 0: no)
        smooth_par_gradient:
          SIGMA_H: 6000        # Horizontal smoothing width (m)
          SIGMA_V: 4000         # Vertical smoothing width (m)
  

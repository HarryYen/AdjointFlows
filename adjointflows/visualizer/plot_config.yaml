work_flow:
    do_preprocessing: False
    perturb_plot:
        plot_horizontal: False
        plot_vertical: True
    absolute_plot:
        plot_horizontal: False
        plot_vertical: False
    plot_vpvs: False
    
    updated_plot:
        plot_horizontal: False
        plot_vertical: False
    

pre_processing:
    model_num: 30
    ref_model_num: 26 # For plotting updated amount
    lon_range: [119.0, 123.0]
    lat_range: [21.0, 26.0]
    dep_range: [0., 100]
    lon_interval: 0.02
    lat_interval: 0.02
    dep_interval: 2


horizontal_slice:
    general_map:
        depth_list: [6, 10, 15, 20, 30, 50, 80, 120, 150]
    fine_tune_perturb:
        scalar_list: ['dvp', 'dvs', 'drho']
        scalar_range: [[-20, 20], [-35, 35], [-20, 20]]
        cmap: '/home/harry/Work/AdjointFlows/adjointflows/visualizer/plotting_files/Vp_ptb.cpt'
        reverse_cmap: False
    
    fine_tune_abs:
        scalar_list: ['vp', 'vs', 'rho']
        unit_list: ['km/s', 'km/s', 'g/cm^3']
        cmap: 'vik'
        reverse_cmap: True

    fine_tune_updated:
        scalar_list: ['dvp','dvs','drho']
        unit_list: ['%', '%', '%']
        cmap: 'jet'
        reverse_cmap: True


vertical_slice:
    layout:
        map_projection: M4.5i
        map_frame: ['neWS', 'a2f1']
        map_to_profile_xshift: 6.7i
        profile_projection: x0.12i/-0.12i
        profile_frame: ['WSne', 'xa20f10ya10f5', 'x+lDistance (km)', 'y+lDepth (km)']
        topography_yshift: 8.5i
        topography_projection: x0.12i/0.6i
        topography_frame: ['WE']
        colorbar_position: JMR+o1.5c/-12.c+w12c/1.c+ml
    general_map:
        map_region: [119, 123.5, 21.5, 26.] # [lon_min, lon_max, lat_min, lat_max]
        dep_range: [0, 60] # e.g. [0, 200] means 0-200 km
        dep_interval_for_interp: 2
        interval_for_profile: 1
        width_profile: [-20, 20] # e.g. [-20, 20] means +- 20 km
        width_for_projecting_eq: [-5, 5] # e.g. [-10, 10] means +- 10 km
        topo_range_for_plot: [-8000, 4000] # e.g. [-8000, 4000] means -8000 to 4000 m
        surface_spacing: 1
    general_flag:
        plot_eq: True # 1: plot eq, 0: not plot eq
        plot_mapview: True # 1: plot mapview, 0: not plot mapview
    general_file:
        topo_grd: /home/harry/Work/AdjointFlows/adjointflows/visualizer/plotting_files/taiwan_topo.grd
        profile_input: /home/harry/Work/adjflows_for_ambient_noise/AdjointFlows/adjointflows/visualizer/plotting_files/profile_eastern_whole.input
        eq_file: /home/harry/Work/AdjointFlows/adjointflows/visualizer/plotting_files/HuangWang_Patrick.csv
    
    fine_tune_perturb:
        scalar_list: ['dvp', 'dvs'] # ['dvp', 'dvs', 'drho']
        scalar_range: [-25, 25] # e.g. [-10, 10] means +- 10%
        cmap: '/home/harry/Work/AdjointFlows/adjointflows/visualizer/plotting_files/Vp_ptb.cpt'
        reverse_cmap: False

    fine_tune_abs:
        scalar_list: ['vp','vs']
        scalar_range_list: [[3.5, 7.6],[2., 4.5]]  # each element is a list corresponding to the scalar_list 
        cbar_label_list: ['Vp (km/s)','Vs (km/s)'] # the number of elements should be the same with scalar_list
        cmap: 'roma'
        reverse_cmap: False # True or False
        contour:
            plot_contour: True
            line_pen: 0.4p,black
            line_interval: 0.25   # unit
            annotation_interval: 0.5 # unit
    
    fine_tune_updated:
        scalar_list: ['vp', 'vs']
        scalar_range_list: [[-20, 20], [-30, 30]]  # each element is a list corresponding to the scalar_list 
        cbar_label_list: ['Vp ln(Mnew/Mold))', 'Vs (ln(Mnew/Mold))'] # the number of elements should be the same with scalar_list
        cmap: 'polar'
        reverse_cmap: True # True or False
        contour:
            plot_contour: False
            line_pen: 0.25p,black
            line_interval: 0.5   # unit
            annotation_interval: 1.0 # unit
        
    fine_tune_vpvs:
        scalar_range: [1.5, 2]  # each element is a list corresponding to the scalar_list 
        cmap: 'rainbow'
        reverse_cmap: False # True or False
        contour:
            plot_contour: True
            line_pen: 0.25p,black
            line_interval: 0.05   # unit
            annotation_interval: 0.1 # unit
